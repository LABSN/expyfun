version: 2.1

_check_skip: &check_skip
  name: Check-skip
  command: |
    set -e
    export COMMIT_MESSAGE=$(git log --format=oneline -n 1);
    if [[ -v CIRCLE_PULL_REQUEST ]] && ([[ "$COMMIT_MESSAGE" == *"[skip circle]"* ]] || [[ "$COMMIT_MESSAGE" == *"[circle skip]"* ]]); then
      echo "Skip detected, exiting job ${CIRCLE_JOB} for PR ${CIRCLE_PULL_REQUEST}."
      circleci-agent step halt;
    fi

# gen3 resource classes are Linux VM only and are valid only with the `current`
# image tag; medium.gen3 has 2 vCPUs and 8 GiB at 7 credits/min
executors:
  linux:
    machine:
      image: ubuntu-2604:current
    resource_class: medium.gen3

jobs:
  build_docs:
    executor: linux
    steps:
      - checkout
      - run:
          <<: *check_skip
      - run:
          name: Merge with upstream
          command: |
            set -eo pipefail
            if [[ -v CIRCLE_PULL_REQUEST ]]; then
              PR_NUM=${CIRCLE_PULL_REQUEST##*/}
              echo "Merging ${PR_NUM}"
              git pull --ff-only origin "refs/pull/${PR_NUM}/merge"
            fi
      - restore_cache:
          keys:
            - pip-cache-0-{{ checksum "./pyproject.toml" }}
            - pip-cache-0-
      - run:
          name: Prep env
          command: |
            set -eo pipefail
            sudo apt-get update
            sudo apt-get install -y libglu1-mesa libxft2 ffmpeg xvfb
            /sbin/start-stop-daemon --start --quiet --pidfile /tmp/custom_xvfb_99.pid --make-pidfile --background --exec /usr/bin/Xvfb -- :99 -screen 0 1400x900x24 -ac +extension GLX +render -noreset
            python3 -m venv ~/python_env
            echo "set -eo pipefail" >> $BASH_ENV
            echo "source ~/python_env/bin/activate" >> $BASH_ENV
            echo "export SOUND_CARD_BACKEND=pyglet" >> $BASH_ENV  # rtmixer needs pulse, which is a huge pain to get running on CircleCI
            echo "export OPENBLAS_NUM_THREADS=2" >> $BASH_ENV
            echo "export XDG_RUNTIME_DIR=/tmp/runtime-circleci" >> $BASH_ENV
            echo "export DISPLAY=:99" >> $BASH_ENV
            echo "export _EXPYFUN_SILENT=true" >> $BASH_ENV
      - run:
          name: Install Python packages
          command: |
            python -m pip install --upgrade --progress-bar off pip
            python -m pip install --upgrade --progress-bar off --group docs -ve .[all] h5py psutil
      - run: python -c "import mne; mne.sys_info()"
      - run: python -c "import pyglet; print(pyglet.version)"
      - run:
          name: Build the documentation
          command: make -C doc html
      - store_artifacts:
          path: doc/_build/html/
          destination: html
      - persist_to_workspace:
          root: doc/_build
          paths: [html]
      - save_cache:
          key: pip-cache-0-{{ checksum "./pyproject.toml" }}
          when: always
          paths:
            - ~/.cache/pip

  deploy:
    docker:
      - image: cimg/base:current
    steps:
      - add_ssh_keys:
          fingerprints:
            - "25:b7:f2:bf:d7:38:6d:b6:c7:78:41:05:01:f8:41:7b"
      - attach_workspace:
          at: /tmp/_build
      - run:
          name: Upload
          command: |
            set -eo pipefail
            echo "Deploying docs."
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            git clone git@github.com:LABSN/labsn.github.io.git ~/labsn.github.io --depth=1 --branch main
            git config --global user.email "circle@labsn.github.io"
            git config --global user.name "Circle CI"
            cd ~/labsn.github.io
            rm -Rf ~/labsn.github.io/expyfun
            cp -a /tmp/_build/html ~/labsn.github.io/expyfun
            git add -A
            git commit -m "CircleCI update of docs (${CIRCLE_BUILD_NUM})."
            git push origin main

workflows:
  build_and_deploy:
    jobs:
      - build_docs
      - deploy:
          requires:
            - build_docs
          filters:
            branches:
              only: main
